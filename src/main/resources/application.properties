spring.application.name=Conversor-de-Moedas

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.tracing.export.otlp.enabled=${OTEL_TRACES_EXPORT_ENABLED:false}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:0.1}
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:false}
management.opentelemetry.resource-attributes[service.name]=${OTEL_SERVICE_NAME:currency-converter}

sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=false
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}

server.error.whitelabel.enabled=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.max-http-request-header-size=8KB
server.tomcat.max-connections=200
server.tomcat.accept-count=50
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=16KB
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=15s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.servlet.multipart.enabled=false
server.servlet.session.cookie.name=CURRENCY-SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m

spring.datasource.url=jdbc:h2:mem:currency_converter;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
app.history.retention-days=${HISTORY_RETENTION_DAYS:30}
api.docs.enabled=true

frankfurter.api.base-url=https://api.frankfurter.dev
