spring.application.name=Conversor-de-Moedas

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.tracing.export.otlp.enabled=${OTEL_TRACES_EXPORT_ENABLED:false}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:0.1}
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:false}
management.opentelemetry.resource-attributes[service.name]=${OTEL_SERVICE_NAME:currency-converter}

sentry.dsn=${SENTRY_DSN:}
sentry.send-default-pii=false
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}

server.error.whitelabel.enabled=false
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=jdbc:h2:mem:currency_converter;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

frankfurter.api.base-url=https://api.frankfurter.dev
