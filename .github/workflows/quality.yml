name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate deployment configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets

          values = {
              "POSTGRES_ADMIN_PASSWORD": secrets.token_hex(32),
              "DATABASE_APP_PASSWORD": secrets.token_hex(32),
              "DATABASE_MIGRATION_PASSWORD": secrets.token_hex(32),
              "DOMAIN": "localhost",
              "HISTORY_RETENTION_DAYS": "30",
          }
          Path(".env").write_text("".join(f"{key}={value}\n" for key, value in values.items()))
          PY
          docker compose config --quiet
          docker compose run --rm --no-deps --entrypoint nginx proxy -t
          docker compose run --rm --no-deps --entrypoint caddy tls_proxy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install JavaScript tooling
        run: npm ci

      - name: Check JavaScript and CSS
        run: npm run lint

      - name: Check unused files and dependencies
        run: npm run knip

      - name: Run JavaScript unit tests with coverage
        run: npm run test:unit:coverage

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Run Java tests and generate JaCoCo report
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build production application image
        run: docker compose build app

      - name: Start production stack and smoke test
        run: |
          docker compose up --detach
          curl --insecure --fail --silent --show-error --retry 45 --retry-delay 2 --retry-connrefused --retry-all-errors https://localhost/ --output /dev/null

      - name: Show deployment logs after a failed smoke test
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop deployment stack
        if: ${{ always() }}
        run: docker compose down --volumes

      - name: Upload Java coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: backend
          token: ${{ env.CODECOV_TOKEN }}

      - name: Upload JavaScript coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: frontend
          token: ${{ env.CODECOV_TOKEN }}

      - name: Check pull request commit messages
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
